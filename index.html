<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youssef Oukassou — CV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; background:#525659; }
  #pages { display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px 0; }
  .page { position:relative; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.35); max-width:100%; }
  .page canvas { display:block; width:100%; height:100%; }
  .page .textLayer { position:absolute; inset:0; }
  .page a.link { position:absolute; display:block; }
  .toggle { position:fixed; top:12px; right:12px; z-index:10; display:flex; border-radius:999px; overflow:hidden;
            background:rgba(255,255,255,.95); box-shadow:0 2px 10px rgba(0,0,0,.3);
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .toggle button { border:0; background:transparent; color:#222; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .toggle button[aria-pressed="true"] { background:#222; color:#fff; }
</style>
</head>
<body>
<div class="toggle" role="group" aria-label="Language">
  <button id="btn-en" aria-pressed="true">EN</button>
  <button id="btn-fr" aria-pressed="false">FR</button>
</div>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const container = document.getElementById("pages");
  const docs = {};
  let current = null, token = 0;

  // PDFs are shipped inside cv-xx.js (base64) so download managers like IDM don't grab them
  function loadData(lang) {
    if (window.CV_DATA && CV_DATA[lang]) return Promise.resolve(CV_DATA[lang]);
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "cv-" + lang + ".js";
      s.onload = () => resolve(CV_DATA[lang]);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function getDoc(lang) {
    docs[lang] = docs[lang] || loadData(lang).then(b64 => {
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return pdfjsLib.getDocument({ data: bytes }).promise;
    });
    return docs[lang];
  }

  async function renderPage(page, width) {
    const scale = width / page.getViewport({ scale: 1 }).width;
    const vp = page.getViewport({ scale });
    const dpr = window.devicePixelRatio || 1;

    const wrap = document.createElement("div");
    wrap.className = "page";
    wrap.style.width = vp.width + "px";
    wrap.style.height = vp.height + "px";

    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    wrap.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: page.getViewport({ scale: scale * dpr }) }).promise;

    // Selectable text
    const text = document.createElement("div");
    text.className = "textLayer";
    text.style.setProperty("--scale-factor", scale);
    wrap.appendChild(text);
    await pdfjsLib.renderTextLayer({ textContentSource: page.streamTextContent(), container: text, viewport: vp, textDivs: [] }).promise;

    // Clickable links (email, GitHub, LinkedIn...)
    for (const a of await page.getAnnotations()) {
      if (a.subtype !== "Link" || !a.url) continue;
      const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
      const link = document.createElement("a");
      link.className = "link";
      link.href = a.url;
      link.target = "_blank";
      link.rel = "noopener";
      Object.assign(link.style, {
        left: Math.min(x1, x2) + "px", top: Math.min(y1, y2) + "px",
        width: Math.abs(x2 - x1) + "px", height: Math.abs(y2 - y1) + "px"
      });
      wrap.appendChild(link);
    }
    return wrap;
  }

  async function render(lang) {
    const my = ++token;
    const pdf = await getDoc(lang);
    if (my !== token) return;
    const width = Math.min(container.clientWidth, 900);
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      pages.push(await renderPage(await pdf.getPage(i), width));
      if (my !== token) return;
    }
    container.replaceChildren(...pages);
  }

  function setLang(lang) {
    if (lang === current) return;
    current = lang;
    document.documentElement.lang = lang;
    document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
    document.getElementById("btn-fr").setAttribute("aria-pressed", lang === "fr");
    history.replaceState(null, "", "#" + lang);
    render(lang);
  }

  document.getElementById("btn-en").onclick = () => setLang("en");
  document.getElementById("btn-fr").onclick = () => setLang("fr");
  let lastWidth = container.clientWidth, resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (container.clientWidth !== lastWidth) { lastWidth = container.clientWidth; render(current); }
    }, 250);
  });

  // #fr / #en in the URL wins; otherwise follow the visitor's browser language
  const hash = location.hash.slice(1);
  const first = hash === "fr" || hash === "en" ? hash : (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
  setLang(first);
  // Preload the other language in the background so switching is instant
  getDoc(first).then(() => getDoc(first === "en" ? "fr" : "en"));
</script>
</body>
</html>
